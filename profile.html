<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory - User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'"><span class="logo-text">V<span>ICTORY</span></span></div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">🏠 ዋና ገጽ</a>
                <a href="order.html" class="nav-link">📦 ማዘዣ</a>
                <a href="tracking.html" class="nav-link">🚚 መከታተያ</a>
                <a href="about.html" class="nav-link">ℹ️ ስለ እኛ</a>
                <a href="contact.html" class="nav-link">📞 አድራሻ</a>
            </nav>
            <div class="menu-toggle" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <div class="drawer" id="drawerMenu">
        <div class="drawer-header"><h3>Menu</h3><span class="close-btn" onclick="toggleDrawer()">&times;</span></div>
        <ul class="drawer-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> ዋና ገጽ</a></li>
            <li><a href="order.html"><i class="fa-solid fa-box-open"></i> ዕቃ ማዘዣ</a></li>
            <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> ፕሮፋይል</a></li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <main class="container section">
        <div class="form-wrap animate-fade-in" style="max-width: 550px; text-align: center;">
            <div class="profile-avatar-wrap">
                <i class="fa-solid fa-circle-user" style="font-size: 100px; color: var(--red); display: inline-block; margin-bottom: 15px;"></i>
            </div>
            <h2 id="profName" style="color: #fff; margin-bottom: 5px;">ቪክቶሪ ደንበኛ</h2>
            <p id="profPhone" style="color: #888; margin-bottom: 25px;">+251 900 000000</p>
            
            <div class="divider"></div>
            
            <div class="profile-stats" style="display: flex; justify-content: space-around; margin: 25px 0;">
                <div>
                    <h3 style="color: var(--red); font-size: 24px;">5</h3>
                    <p style="color: #aaa; font-size: 13px;">አጠቃላይ ትዕዛዞች</p>
                </div>
                <div>
                    <h3 style="color: #2ecc71; font-size: 24px;">1</h3>
                    <p style="color: #aaa; font-size: 13px;">በጉዞ ላይ ያለ</p>
                </div>
            </div>

            <div class="divider"></div>

            <button class="btn btn-outline" style="width: 100%; margin-top: 20px; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 8px;" onclick="alert('ፕሮፋይል ማስተካከያ በቅርቡ ይጠናቀቃል!')">
                <i class="fa-solid fa-user-gear"></i> ፕሮፋይል አሻሽል
            </button>
        </div>
    </main>

    <div class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>ዋና ገጽ</span></a>
        <a href="order.html" class="bottom-nav-item"><i class="fa-solid fa-box"></i><span>ማዘዣ</span></a>
        <a href="tracking.html" class="bottom-nav-item"><i class="fa-solid fa-truck"></i><span>መከታተያ</span></a>
        <a href="profile.html" class="bottom-nav-item active"><i class="fa-solid fa-user"></i><span>ፕሮፋይል</span></a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
