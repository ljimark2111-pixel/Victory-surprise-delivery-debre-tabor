<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory - ተጠቃሚ ፕሮፋይል</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-box { max-width: 450px; margin: 40px auto; padding: 30px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; text-align: center; }
        .auth-box h2 { margin-bottom: 20px; }
        .auth-toggle { margin-top: 15px; font-size: 14px; color: var(--text-muted); }
        .auth-toggle span { color: var(--red); cursor: pointer; text-decoration: underline; }
        .profile-card { max-width: 500px; margin: 40px auto; padding: 40px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; text-align: center; display: none; }
        .avatar-circle { width: 90px; height: 90px; background-color: rgba(255, 51, 68, 0.1); border: 2px solid var(--red); color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px auto; }
        .p-email { font-size: 16px; color: var(--text-muted); margin-bottom: 30px; }
        .logout-btn { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-weight: 600; }
        .logout-btn:hover { background-color: var(--red); color: white; border-color: var(--red); }
    </style>
</head>
<body><div class="bg-logo-animation">
    <img src="logo.png" alt="Victory Delivery Logo" class="anim-logo-img">
</div>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'"><span class="logo-text">V<span>ICTORY</span></span></div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">🏠 ዋና ገጽ</a>
                <a href="order.html" class="nav-link">📦 ማዘዣ</a>
                <a href="tracking.html" class="nav-link">🚚 መከታተያ</a>
                <a href="about.html" class="nav-link">ℹ️ ስለ እኛ</a>
            </nav>
            <div class="menu-toggle" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <!-- የጎን ምናሌ -->
    <div class="drawer" id="drawerMenu">
        <div class="drawer-header"><h3>ማውጫ Menu</h3><span class="close-btn" onclick="toggleDrawer()">&times;</span></div>
        <ul class="drawer-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> ዋና ገጽ</a></li>
            <li><a href="order.html"><i class="fa-solid fa-box-open"></i> ዕቃ ማዘዣ</a></li>
            <li><a href="tracking.html"><i class="fa-solid fa-truck-fast"></i> የቀጥታ መከታተያ</a></li>
            <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> ፕሮፋይል</a></li>
            <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> ስለ እኛ</a></li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <main class="container section">
        <!-- 1. የመመዝገቢያና መግቢያ ፎርም -->
        <div class="auth-box id="authBox" class="animate-fade-in">
            <h2 id="authTitle"><i class="fa-solid fa-right-to-bracket"></i> ወደ አካውንት መግቢያ</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>ኢሜይል (Email)</label>
                    <input type="email" id="authEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>የይለፍ ቃል (Password)</label>
                    <input type="password" id="authPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" id="authBtn" class="submit-btn">ግባ (Login)</button>
            </form>
            <div class="auth-toggle" id="authToggleText">አካውንት የለዎትም? <span onclick="switchAuthMode(true)">አዲስ ክፈት (Sign Up)</span></div>
        </div>

        <!-- 2. የውስጥ እውነተኛ ፕሮፋይል ገጽ -->
        <div class="profile-card" id="profileCard" class="animate-fade-in">
            <div class="avatar-circle"><i class="fa-solid fa-user-shield"></i></div>
            <h2 style="margin-bottom: 5px;">እንኳን ደህና መጡ!</h2>
            <p class="p-email" id="userEmailDisplay">...</p>
            <div class="divider" style="margin-bottom: 25px;"></div>
            <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i> ከአካውንት ውጣ (Logout)</button>
        </div>
    </main>

    <div class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>ዋና ገጽ</span></a>
        <a href="order.html" class="bottom-nav-item"><i class="fa-solid fa-box"></i><span>ማዘዣ</span></a>
        <a href="tracking.html" class="bottom-nav-item"><i class="fa-solid fa-truck"></i><span>መከታተያ</span></a>
        <a href="profile.html" class="bottom-nav-item active"><i class="fa-solid fa-user"></i><span>ፕሮፋይል</span></a>
    </div>

    <!-- የ Firebase ሲስተም ማገናኛዎች -->
    <script type="module" src="js/auth.js"></script>
    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawerMenu');
            const overlay = document.getElementById('overlay');
            if(drawer && overlay) { drawer.classList.toggle('active'); overlay.classList.toggle('active'); }
        }
    </script>
</body>
</html>
